# Games yomu knows how to bridge.
#
#   process | work slug | title | dialect
#
# The process is what gates forwarding: the clipboard is shared with everything
# on the machine, so text is only ever sent while one of these is running. It is
# matched against a whole process name, not a substring, and Linux truncates
# those at 15 characters -- check `ps -eo comm=` before adding a longer one.
#
# The dialect is the engine markup its text carries; see doc/WORKS.md. Use
# `none` for a game whose hook emits clean text.
#
# Adding a line here is the whole of adding a game. Nothing else needs changing,
# and the bridge picks it up on its next start.

manosaba.exe   | manosaba          | 魔法少女ノ魔女裁判  | none
sgre_steam.exe | steinsgate-reboot | STEINS;GATE RE:BOOT | sciadv
